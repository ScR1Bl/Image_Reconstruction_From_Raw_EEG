[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-mae"
version = "0.1.0"
description = "Reproducible THINGS-EEG2 semantic, color, edge and PixArt pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10", "torch>=2.2", "lightning==2.6.6", "torchmetrics==1.3.2", "PyYAML>=6"]

[project.optional-dependencies]
visual-teachers = [
  "Pillow>=10",
  "transformers>=5.0",
  "torchvision>=0.20",
  "scipy>=1.12",
  "opencv-python>=4.9",
]
dev = ["pytest>=8", "ruff>=0.12"]
dit = ["diffusers>=0.34", "accelerate>=1.0"]

[project.scripts]
eeg-build-index = "eeg_mae.data.build_dataset_index:main"
eeg-build-cache = "eeg_mae.data.build_eeg_cache:main"
eeg-train-color = "eeg_mae.training.train_color_encoder:main"
eeg-train-edges = "eeg_mae.training.train_edge_encoder:main"
eeg-train-semantic = "eeg_mae.lightning.train_eeg_encoder:main"
eeg-train-dit = "eeg_mae.lightning.train_dit_adapter:main"
eeg-reconstruct = "eeg_mae.evaluation.reconstruct_eeg:main"

# The repository intentionally also contains large runtime directories such as
# data/ and runs/. Never let setuptools' flat-layout discovery treat them as
# Python namespace packages.
[tool.setuptools]
packages = [
  "eeg_mae",
  "eeg_mae.data",
  "eeg_mae.evaluation",
  "eeg_mae.lightning",
  "eeg_mae.models",
  "eeg_mae.training",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
